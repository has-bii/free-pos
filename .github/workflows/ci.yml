name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Test runs never perform DDL, so the schema has to be brought forward
      # separately. Uses the same secret as the suite, via DATABASE_URL —
      # drizzle-kit's own env var, not the Worker's FREE_POS_DATABASE_URL.
      - name: Apply migrations to the test database
        run: pnpm --filter @repo/database db:migrate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      # The auth route tests run against a real TiDB database. Concurrent runs
      # are safe: every test mints a unique `t-<uuid>@test.invalid` address and
      # cleans up after itself, so runs never collide.
      #
      # TEST_DATABASE_URL must also be declared in turbo.json's `test` task —
      # turbo's strict env mode drops anything undeclared, and the suite would
      # then fail on test/setup.ts's "not set" guard rather than run.
      - name: Lint, typecheck, test
        run: pnpm turbo run lint typecheck test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
